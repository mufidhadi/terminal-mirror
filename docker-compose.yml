version: "3.8"

services:
  relay-server:
    build:
      context: .
      dockerfile: services/relay-server/Dockerfile
    container_name: terminal-mirror-relay
    restart: unless-stopped
    ports:
      # Bind to internal VPN / localhost interface in production
      - "${RELAY_BIND_IP:-127.0.0.1}:${RELAY_PORT:-8080}:8080"
    environment:
      - RELAY_BIND_ADDR=0.0.0.0:8080
      - RELAY_AUTH_TOKEN=${RELAY_AUTH_TOKEN:-change_this_secret_token}
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

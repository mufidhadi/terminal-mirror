name: Secret Hygiene Scan

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "plan/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  scan-tracked-code:
    name: Fail on leaked relay secrets in code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked code/config for known-secret patterns
        run: |
          set -eu
          # Scope: code + config only. Historical AI reports under docs/
          # document the leak as evidence and are intentionally excluded;
          # rotation (not redaction) is the fix for history.
          PATTERNS="masmufid_super_secret|batu-merah-kuda-terbang|172\.23\.127\.184"
          SCOPES="apps crates services scripts tests run-mac.command docker-compose.yml .env.example"
          HITS=$(git grep -n -E "$PATTERNS" -- $SCOPES || true)
          if [ -n "$HITS" ]; then
            echo "LEAKED SECRET PATTERN FOUND IN TRACKED CODE:"
            echo "$HITS"
            exit 1
          fi
          echo "Secret hygiene scan passed: no known-secret patterns in code scope."

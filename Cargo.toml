[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "services/relay-server",
    "apps/mac",
    "apps/windows",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["mufid <mufidhadi@madhani.id>"]
license = "MIT"
repository = "https://github.com/mufidhadi/terminal-mirror"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
bytes = "1.6"
futures-util = "0.3"
portable-pty = "0.8"
snow = { version = "0.9", features = ["ring-accelerated"] }
